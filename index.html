<!doctype html>

  <title>心禹國際｜2.1 噸 LED 行動廣告車虛擬播放器</title>
  <meta name="description" content="心禹國際 2.1 噸 LED 行動廣告車 3D 虛擬播放器，支援左側無縫 L 型 LED 與右側滿版 LED 影片預覽。" />
  <style>
    :root{--bg:#06101d;--panel:#0b1827;--panel2:#102236;--line:#203951;--text:#eef5fc;--muted:#9eb0c3;--gold:#d6ae59;--blue:#2d9cff;--ok:#44d19d;--warn:#ffcb69;--danger:#ff7a7a}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}
    .app{height:100%;display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#081421,#0c1d31);z-index:5}
    .brand{display:flex;gap:12px;align-items:center;min-width:0}.brand>div:last-child{min-width:0}.mark{width:42px;height:42px;flex:0 0 auto;border:1px solid #8d6d2f;border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:900;background:#090d13}.brand b{display:block;letter-spacing:.04em}.brand small{display:block;color:var(--muted);margin-top:2px}.header-actions{display:flex;gap:8px}.pill{border:1px solid var(--line);background:#0b1928;color:var(--text);padding:8px 11px;border-radius:10px}.pill:hover{border-color:#3f6688}
    aside{padding:15px;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}.section{border:1px solid var(--line);border-radius:14px;background:rgba(16,34,54,.72);padding:13px;margin-bottom:12px}.section h2{font-size:14px;margin:0 0 10px;color:#fff}.section p,.hint{font-size:12px;line-height:1.55;color:var(--muted);margin:7px 0}
    .upload{display:block;border:1px dashed #46637d;border-radius:12px;padding:12px;margin:8px 0;background:#0b1725;transition:.2s}.upload:hover{border-color:var(--blue);background:#0d1e30}.upload strong{display:block;font-size:13px}.upload span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.upload em{display:block;font-size:11px;color:var(--ok);font-style:normal;margin-top:5px;min-height:1.2em}.upload input{display:none}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid var(--line);background:#102337;color:var(--text);border-radius:10px;padding:10px}.btn:hover{border-color:#48779d;background:#15304a}.btn.primary{background:#176bb5;border-color:#2d9cff}.btn.gold{background:#59431d;border-color:#a77d31;color:#ffe2a3}.btn.active{outline:2px solid var(--ok);outline-offset:-2px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .status{white-space:pre-line;font-size:12px;line-height:1.6;color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.error{color:var(--danger)}main{position:relative;min-width:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#142a43 0,#07111f 55%,#050b13 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}
    .hud{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.tag{background:rgba(4,10,17,.76);border:1px solid rgba(101,139,170,.35);backdrop-filter:blur(8px);border-radius:9px;padding:7px 9px;font-size:11px;color:#c9d7e5}.drop-overlay{position:absolute;inset:18px;border:2px dashed var(--blue);border-radius:18px;display:none;place-items:center;background:rgba(4,15,27,.86);z-index:9;font-size:18px;font-weight:800}.drop-overlay.show{display:grid}
    .loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#07111f;z-index:8;padding:24px}.spinner{width:42px;height:42px;border:3px solid #1b334b;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:auto}.loading p{color:var(--muted);font-size:13px;line-height:1.6}@keyframes spin{to{transform:rotate(360deg)}}.mobile-tools{display:none}
    .webgl-error{max-width:620px;border:1px solid #743d45;background:#251219;border-radius:16px;padding:20px;color:#ffd7dc}.webgl-error h2{margin-top:0}
    @media(max-width:860px){html,body{overflow:auto}.app{min-height:100%;height:auto;display:flex;flex-direction:column}header{position:sticky;top:0}.brand b{font-size:14px}.brand small{display:none}.header-actions{display:none}main{height:58vh;min-height:410px;order:1}aside{order:2;border-right:0;border-top:1px solid var(--line);overflow:visible}.mobile-tools{display:flex;position:absolute;right:10px;top:10px;gap:6px;z-index:6}.mobile-tools button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(7,17,31,.82);color:#fff}.hud{bottom:10px;left:10px}.tag:nth-child(n+3){display:none}}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
  </script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark">心禹</div><div><b>心禹國際 LED 行動廣告車虛擬播放器</b><small>2.1 噸車｜滿版無框｜左側 90° 無縫 L 型顯示</small></div></div>
    <div class="header-actions"><button class="pill" id="shotBtn">擷取畫面</button><button class="pill" id="fullBtn">全螢幕</button></div>
  </header>
  <aside>
    <div class="section">
      <h2>顯示內容</h2>
      <label class="upload"><strong>左側 L 型螢幕</strong><span>同一支影片／圖片連續跨越主屏與 90° 轉角屏。</span><em id="leftName">尚未選擇素材</em><input id="leftMedia" type="file" accept="video/mp4,video/webm,video/quicktime,image/png,image/jpeg,image/webp"></label>
      <label class="upload"><strong>右側平面螢幕</strong><span>上下與四周滿版顯示，不含裝飾框。</span><em id="rightName">尚未選擇素材</em><input id="rightMedia" type="file" accept="video/mp4,video/webm,video/quicktime,image/png,image/jpeg,image/webp"></label>
      <label class="upload"><strong>車頭上方小螢幕（選用）</strong><span>可獨立放置品牌動畫或靜態圖片。</span><em id="frontName">尚未選擇素材</em><input id="frontMedia" type="file" accept="video/mp4,video/webm,video/quicktime,image/png,image/jpeg,image/webp"></label>
      <p class="hint">左側建議素材比例 3.34:1，例如 1920×575；右側建議比例 1.75:1，例如 1920×1097。比例不同時會延展滿版。</p>
    </div>
    <div class="section"><h2>播放控制</h2><div class="row"><button class="btn primary" id="playBtn">全部播放</button><button class="btn" id="pauseBtn">全部暫停</button><button class="btn" id="muteBtn">靜音切換</button><button class="btn" id="clearBtn">清除素材</button></div></div>
    <div class="section"><h2>視角</h2><div class="row"><button class="btn gold" data-view="iso">立體視角</button><button class="btn" data-view="left">左側 L 型</button><button class="btn" data-view="right">右側平面</button><button class="btn" data-view="rear">車尾與門</button><button class="btn" id="rotateBtn">自動旋轉</button><button class="btn" id="resetBtn">重設視角</button></div></div>
    <div class="section"><h2>模型驗證</h2><div class="status" id="status">正在載入模型…</div></div>
    <div class="section"><h2>操作方式</h2><p>電腦：滑鼠左鍵旋轉、滾輪縮放、右鍵平移。手機：單指旋轉、雙指縮放與平移。素材只在你的瀏覽器中播放，不會上傳到伺服器。</p></div>
  </aside>
  <main id="stage">
    <div class="loading" id="loading"><div><div class="spinner"></div><p>載入行動廣告車模型中</p></div></div>
    <div class="drop-overlay" id="dropOverlay">放開檔案，套用至左側 L 型螢幕</div>
    <div class="mobile-tools"><button id="mobileFull" aria-label="全螢幕">⛶</button><button id="mobileReset" aria-label="重設視角">↺</button></div>
    <div class="hud"><div class="tag">滿版無框 LED</div><div class="tag">90° 無縫轉角</div><div class="tag">車尾右側唯一出入口門</div></div>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_URL='./assets/models/Xinyu_2.1t_LED_Mobile_Ad_Truck_V2.glb';
const LEFT_MAIN_W=3.69,LEFT_REAR_W=1.12,LEFT_TOTAL_W=LEFT_MAIN_W+LEFT_REAR_W;
const mainFraction=LEFT_MAIN_W/LEFT_TOTAL_W,rearFraction=LEFT_REAR_W/LEFT_TOTAL_W;
const $=id=>document.getElementById(id),stage=$('stage'),statusEl=$('status'),loading=$('loading');
const inputs={left:$('leftMedia'),right:$('rightMedia'),front:$('frontMedia')};
const labels={left:$('leftName'),right:$('rightName'),front:$('frontName')};
const buttons={play:$('playBtn'),pause:$('pauseBtn'),mute:$('muteBtn'),clear:$('clearBtn'),rotate:$('rotateBtn'),reset:$('resetBtn'),full:$('fullBtn'),shot:$('shotBtn'),mobileFull:$('mobileFull'),mobileReset:$('mobileReset')};

function showWebGLError(){loading.innerHTML='<div class="webgl-error"><h2>此瀏覽器無法使用 3D 播放器</h2><p>請改用最新版 Chrome、Edge、Safari 或 Firefox，並確認硬體加速已開啟。</p></div>'}
if(!window.WebGLRenderingContext){showWebGLError();throw new Error('WebGL unavailable')}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);scene.fog=new THREE.Fog(0x07111f,14,34);
const camera=new THREE.PerspectiveCamera(40,1,.03,100);
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true})}catch(error){showWebGLError();throw error}renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.target.set(0,1.5,0);controls.maxPolarAngle=Math.PI*.49;controls.minDistance=4;controls.maxDistance=18;
scene.add(new THREE.HemisphereLight(0xcbe5ff,0x17202a,1.8));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(-5,9,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const rim=new THREE.DirectionalLight(0x4fa8ff,1.1);rim.position.set(7,5,-8);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x0b1724,roughness:.95,metalness:.05}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(30,30,0x345675,0x172d43);grid.material.opacity=.38;grid.material.transparent=true;scene.add(grid);
let model=null;const screenNames=['LED_LEFT_MAIN','LED_LEFT_REAR','LED_RIGHT_MAIN','LED_FRONT_HEADER'];const mediaState={left:null,right:null,front:null},loadTokens={left:0,right:0,front:0},managedMaterials=new WeakSet();
const mesh=name=>model?.getObjectByName(name)||null;
function trackMaterial(material){managedMaterials.add(material);return material}
function disposeMaterial(material){if(!material||!managedMaterials.has(material))return;material.map?.dispose?.();material.dispose?.();managedMaterials.delete(material)}
function setScreenMaterial(name,material){const target=mesh(name);if(!target){disposeMaterial(material);throw new Error(`模型缺少必要物件：${name}`)}disposeMaterial(target.material);target.material=material}
function placeholderMaterial(title){const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1024,512);g.addColorStop(0,'#07131f');g.addColorStop(1,'#123c65');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(214,174,89,.72)';x.lineWidth=8;x.strokeRect(22,22,c.width-44,c.height-44);x.fillStyle='#d6ae59';x.font='700 62px Microsoft JhengHei, sans-serif';x.textAlign='center';x.fillText('心禹國際',512,220);x.fillStyle='#eef5fc';x.font='36px Microsoft JhengHei, sans-serif';x.fillText(title,512,290);x.fillStyle='#9eb0c3';x.font='24px Microsoft JhengHei, sans-serif';x.fillText('點選左側面板上傳影片或圖片',512,350);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.flipY=false;return trackMaterial(new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide,toneMapped:false}))}
function resize(){const w=Math.max(stage.clientWidth,1),h=Math.max(stage.clientHeight,1);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);new ResizeObserver(resize).observe(stage);resize();
function setView(name){const views={iso:[-7.7,4.8,7.5],left:[.8,2.25,9.2],right:[.7,2.25,-9.2],rear:[8.7,2.45,2.3]};camera.position.set(...(views[name]||views.iso));controls.target.set(0,1.48,0);controls.update()}
function validateModel(){const found=screenNames.filter(n=>mesh(n));const forbidden=[];model.traverse(o=>{if(/LED_(LEFT|RIGHT).*FRAME/i.test(o.name))forbidden.push(o.name)});const a=mesh('LED_LEFT_MAIN'),b=mesh('LED_LEFT_REAR');let seam='無法檢查';if(a&&b){const ba=new THREE.Box3().setFromObject(a),bb=new THREE.Box3().setFromObject(b);const dx=Math.abs(ba.max.x-bb.min.x),dz=Math.abs(ba.max.z-bb.max.z);seam=(dx<.002&&dz<.002)?'通過（共同邊線 0 mm）':`需檢查（ΔX ${Math.round(dx*1000)} mm／ΔZ ${Math.round(dz*1000)} mm）`}statusEl.innerHTML=`<span class="ok">模型載入完成</span>\nLED 螢幕辨識：${found.length}/4\n螢幕外框物件：${forbidden.length===0?'0（通過）':forbidden.join(', ')}\n左側 90° 轉角：${seam}\n車尾右側門：${mesh('REAR_RIGHT_ACCESS_DOOR')?'已保留（通過）':'未辨識'}`}
new GLTFLoader().load(MODEL_URL,g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});try{setScreenMaterial('LED_LEFT_MAIN',placeholderMaterial('左側 L 型主螢幕'));setScreenMaterial('LED_LEFT_REAR',placeholderMaterial('左側 90° 轉角螢幕'));setScreenMaterial('LED_RIGHT_MAIN',placeholderMaterial('右側平面螢幕'));setScreenMaterial('LED_FRONT_HEADER',placeholderMaterial('車頭上方螢幕'));setView('iso');validateModel();loading.remove()}catch(error){loading.innerHTML='<div class="webgl-error"><h2>模型內容不完整</h2><p>必要的 LED 顯示物件不存在，請確認模型檔版本正確。</p></div>';statusEl.innerHTML=`<span class="error">${String(error)}</span>`}},undefined,e=>{loading.innerHTML='<div class="webgl-error"><h2>模型載入失敗</h2><p>請重新整理頁面，並確認網路連線正常。若仍失敗，請確認模型檔仍位於 assets/models 資料夾。</p></div>';statusEl.innerHTML=`<span class="error">${String(e)}</span>`});
function cleanupRole(role){const s=mediaState[role];if(!s)return;if(s.video){s.video.pause();s.video.removeAttribute('src');s.video.load()}s.materials?.forEach(disposeMaterial);if(s.url)URL.revokeObjectURL(s.url);mediaState[role]=null}
function materialForTexture(tex){return trackMaterial(new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,toneMapped:false}))}
function videoTexture(video,repeatX=1,offsetX=0){const t=new THREE.VideoTexture(video);t.colorSpace=THREE.SRGBColorSpace;t.flipY=false;t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;t.wrapS=THREE.ClampToEdgeWrapping;t.repeat.set(repeatX,1);t.offset.set(offsetX,0);return t}
function imageTexture(url,repeatX=1,offsetX=0){return new Promise((resolve,reject)=>new THREE.TextureLoader().load(url,t=>{t.colorSpace=THREE.SRGBColorSpace;t.flipY=false;t.wrapS=THREE.ClampToEdgeWrapping;t.repeat.set(repeatX,1);t.offset.set(offsetX,0);resolve(t)},undefined,reject))}
async function applyFile(file,role){if(!file||!model)return;const token=++loadTokens[role];labels[role].textContent=`載入中：${file.name}`;const url=URL.createObjectURL(file),isVideo=file.type.startsWith('video/');let video=null;const materials=[];if(isVideo){video=document.createElement('video');video.src=url;video.loop=true;video.muted=true;video.playsInline=true;video.preload='metadata'}const mk=async(repeat,offset)=>materialForTexture(isVideo?videoTexture(video,repeat,offset):await imageTexture(url,repeat,offset));try{if(role==='left'){materials.push(await mk(mainFraction,0),await mk(rearFraction,mainFraction))}else{materials.push(await mk(1,0))}if(token!==loadTokens[role])throw new DOMException('素材已由較新的選擇取代','AbortError');cleanupRole(role);if(role==='left'){setScreenMaterial('LED_LEFT_MAIN',materials[0]);setScreenMaterial('LED_LEFT_REAR',materials[1])}else if(role==='right'){setScreenMaterial('LED_RIGHT_MAIN',materials[0])}else{setScreenMaterial('LED_FRONT_HEADER',materials[0])}mediaState[role]={url,video,materials};labels[role].textContent=`已套用：${file.name}`;if(video)await video.play().catch(()=>{})}catch(err){materials.forEach(disposeMaterial);if(video){video.pause();video.removeAttribute('src');video.load()}URL.revokeObjectURL(url);if(err.name!=='AbortError'){labels[role].textContent='素材載入失敗';statusEl.innerHTML+=`\n<span class="error">${file.name} 載入失敗：${String(err)}</span>`}}}
Object.entries(inputs).forEach(([role,input])=>input.addEventListener('change',e=>applyFile(e.target.files?.[0],role)));
buttons.play.onclick=()=>Object.values(mediaState).forEach(s=>s?.video?.play().catch(()=>{}));buttons.pause.onclick=()=>Object.values(mediaState).forEach(s=>s?.video?.pause());buttons.mute.onclick=()=>Object.values(mediaState).forEach(s=>{if(s?.video)s.video.muted=!s.video.muted});buttons.clear.onclick=()=>{Object.keys(loadTokens).forEach(role=>loadTokens[role]++);Object.keys(mediaState).forEach(cleanupRole);Object.values(inputs).forEach(i=>i.value='');Object.entries(labels).forEach(([r,l])=>l.textContent='尚未選擇素材');if(model){setScreenMaterial('LED_LEFT_MAIN',placeholderMaterial('左側 L 型主螢幕'));setScreenMaterial('LED_LEFT_REAR',placeholderMaterial('左側 90° 轉角螢幕'));setScreenMaterial('LED_RIGHT_MAIN',placeholderMaterial('右側平面螢幕'));setScreenMaterial('LED_FRONT_HEADER',placeholderMaterial('車頭上方螢幕'))}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));buttons.rotate.onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=1.25;buttons.rotate.classList.toggle('active',controls.autoRotate)};buttons.reset.onclick=buttons.mobileReset.onclick=()=>setView('iso');
function toggleFull(){if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()}buttons.full.onclick=buttons.mobileFull.onclick=toggleFull;buttons.shot.onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.download='心禹國際_LED行動廣告車_虛擬預覽.png';a.href=renderer.domElement.toDataURL('image/png');a.click()};
const dropOverlay=$('dropOverlay');['dragenter','dragover'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();dropOverlay.classList.add('show')}));['dragleave','drop'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();dropOverlay.classList.remove('show')}));stage.addEventListener('drop',e=>{const f=e.dataTransfer.files?.[0];if(f)applyFile(f,'left')});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
